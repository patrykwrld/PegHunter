<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Peg Hunter · Hot Wheels Treasure Hunt scanner</title>
<meta name="description" content="Snap a Hot Wheels car in its pack. Find out if it is a Treasure Hunt or Super Treasure Hunt, what it is worth in pounds, and keep it in your album.">
<meta name="theme-color" content="#0A0B0F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Peg Hunter">
<meta property="og:title" content="Peg Hunter">
<meta property="og:description" content="Is it a Treasure Hunt? Scan it, price it in pounds, save it to your album.">
<meta property="og:type" content="website">
<meta property="og:image" content="/icons/icon-512.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="/icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Extra+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="app" id="app">

  <!-- SCAN: full-screen camera -->
  <section class="scanner" id="v-scan" hidden aria-label="Scanner">
    <div class="wall" id="wall" aria-hidden="true"><div class="wall-cards" id="wall-cards"></div></div>
    <video class="feed" id="feed" playsinline muted autoplay hidden></video>
    <img class="still" id="still" alt="Your photo" hidden>
    <div class="beam" id="beam" aria-hidden="true" hidden></div>
    <div class="boxes" id="boxes"></div>
    <div class="scan-msg" id="scan-msg" hidden></div>
    <div class="busy" id="busy" hidden><i class="spin"></i><span>Checking the cards…</span></div>

    <div class="scan-top">
      <a class="round" href="#album" aria-label="Close scanner"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
      <div class="live" id="live"><i class="blink" id="live-dot"></i><span id="live-k">LIVE</span><span id="live-mode">Peg sweep</span></div>
      <button class="round" type="button" id="torch" aria-label="Torch" aria-pressed="false" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L5 13h6l-1 9 8-11h-6z"/></svg></button>
      <span id="torch-gap" style="width:44px" aria-hidden="true"></span>
    </div>
    <div class="hint"><div id="hint">Move slowly along the pegs. Hold still, then tap scan.</div></div>

    <div class="scan-bottom">
      <div class="tally" id="tally">
        <div style="display:flex;flex-direction:column;gap:1px;min-width:0">
          <span class="label" id="tally-k">This peg wall</span>
          <span class="disp" id="tally-v">Ready to scan</span>
        </div>
        <div class="chips" id="tally-chips" style="flex:none"></div>
      </div>
      <div class="seg" role="group" aria-label="Scan mode" id="modes">
        <button type="button" data-mode="card" aria-pressed="false">One card</button>
        <button type="button" data-mode="sweep" aria-pressed="true">Peg sweep</button>
        <button type="button" data-mode="barcode" aria-pressed="false" disabled title="Coming soon">Barcode<small>Soon</small></button>
      </div>
      <div class="controls">
        <label class="sq" style="justify-self:start" aria-label="Pick from gallery">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 16l5-5 4 4 3-3 6 6"/></svg>
          <input id="in-gallery" type="file" accept="image/*">
        </label>
        <button class="shutter" type="button" id="shutter" aria-label="Scan now"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M7 12h10"/></svg></span></button>
        <a class="sq" style="justify-self:end" href="#album" id="to-album" aria-label="Open album"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg><span class="badge num" id="album-badge" hidden>0</span></a>
      </div>
    </div>
  </section>

  <section class="scr bare" id="v-result" hidden aria-label="Scan result"></section>
  <section class="scr" id="v-album" hidden aria-label="Album"></section>
  <section class="scr bare" id="v-car" hidden aria-label="Car"></section>
  <section class="scr" id="v-db" hidden aria-label="Database"></section>

  <nav class="tabs" id="tabs" aria-label="Main">
    <a class="tab" href="#album" data-v="album"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg>Album</a>
    <a class="tab" href="#scan" data-v="scan"><span class="shoot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M7 12h10"/></svg></span>Scan</a>
    <a class="tab" href="#db" data-v="db"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Prices</a>
  </nav>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<div class="offline" id="offline" hidden>Offline · album still works</div>
<script type="module" src="/js/app.js"></script>
</body>
</html>
